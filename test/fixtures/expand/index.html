<!doctype html>
<html>
<head><meta charset="utf-8"><title>Jobs - expand in place</title></head>
<body>
  <h1>Open roles</h1>
  <!-- Every card expands IN PLACE. No navigation, no URL change - the case where
       goBack() would land on about:blank and wipe the remaining items. -->
  <ul id="results">
    <li class="card"><span class="title">Frontend Engineer</span><button class="toggle" aria-label="Show more">Show more</button><div class="desc" hidden>Description 1</div></li>
    <li class="card"><span class="title">Backend Engineer</span><button class="toggle" aria-label="Show more">Show more</button><div class="desc" hidden>Description 2</div></li>
    <li class="card"><span class="title">Data Engineer</span><button class="toggle" aria-label="Show more">Show more</button><div class="desc" hidden>Description 3</div></li>
    <li class="card"><span class="title">Platform Engineer</span><button class="toggle" aria-label="Show more">Show more</button><div class="desc" hidden>Description 4</div></li>
    <li class="card"><span class="title">QA Engineer</span><button class="toggle" aria-label="Show more">Show more</button><div class="desc" hidden>Description 5</div></li>
  </ul>
  <script>
    for (const btn of document.querySelectorAll('.toggle')) {
      btn.addEventListener('click', (e) => {
        e.currentTarget.parentElement.querySelector('.desc').hidden = false;
      });
    }
  </script>
</body>
</html>
