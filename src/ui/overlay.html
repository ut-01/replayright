<!--
  overlay.html - markup template for the recording overlay's shadow DOM content.

  Just the toolbar chrome: a persistent open-block strip and a row of two marker
  buttons, icon + letter caption each. No inline styles (overlay.css owns all of
  that) and no aria-label baked in here - overlay.js sets it at mount time and
  again on every state change, since the label IS the marker meaning Playwright's
  own selector generator reads back out of the recorded action (see CLAUDE.md).

  The floating toast, the cursor-following pick label and the hover-badge are NOT
  in this template - they live in the page's light DOM, built directly by
  overlay.js, because the :host rule in overlay.css positions this shadow host
  with a `transform`, and a transformed ancestor becomes the containing block for
  any `position: fixed` descendant. A toast rendered in here would be pinned to
  this little toolbar box instead of the viewport corner it's meant to float in.

  data-pr="..." hooks are how overlay.js finds these nodes after cloning this
  template into the shadow root; nothing here is ever queried by tag or class
  alone.

  Icons are plain Unicode placeholders (Phase 2.2) - swap for real icon files in
  Phase 3 without touching this structure. The R/F letter captions stay: they're
  what the docs, the CLI hints and muscle memory all refer to, so icon-only would
  cost more than it gains.

  The drag handle carries a `playright:ui:drag-handle` marker even though the drag
  gesture itself (mousedown/mousemove/mouseup, wired in overlay.js) never fires a
  Playwright-recordable `click` - the marker is defense-in-depth for a zero-movement
  press-release, which Playwright's recorder WOULD see as an ordinary click on an
  accessible element. Without the prefix that stray click would leak into flow.json,
  same failure class the stray-click guard in overlay.js exists to prevent elsewhere.

  It MUST be a real `<button>`, not a `<div>`, for that marker to actually work: a
  plain `<div>` has no implicit ARIA role, and `aria-label` on a role-less/generic
  element is not exposed as its accessible name at all - confirmed against a real
  recording, where Playwright's generator fell back to a text-based selector
  (`internal:text="..."`) instead of a role locator carrying the marker, and the
  click leaked into flow.json as two ordinary steps. A `<button>` (implicit
  role=button, same as every other marker-carrying element here) is what makes
  aria-label become the accessible name Playwright's role locator reads.
-->
<div class="pr-open-strip" data-pr="open-strip" hidden></div>
<div class="pr-row" data-pr="row">
  <button type="button" class="pr-drag-handle" data-pr="drag-handle" aria-label="playright:ui:drag-handle" title="Drag to move">
    <span aria-hidden="true">&#8942;&#8942;</span>
  </button>
  <button type="button" class="pr-btn pr-btn--r" data-pr="r-btn">
    <span class="pr-btn-icon" aria-hidden="true">&#10227;</span>
    <span class="pr-btn-label">R</span>
  </button>
  <button type="button" class="pr-btn pr-btn--f" data-pr="f-btn">
    <span class="pr-btn-icon" aria-hidden="true">&#9638;</span>
    <span class="pr-btn-label">F</span>
  </button>
  <button type="button" class="pr-btn pr-btn--a" data-pr="a-btn">
    <span class="pr-btn-icon" aria-hidden="true">&#10003;</span>
    <span class="pr-btn-label">A</span>
  </button>
  <button type="button" class="pr-btn pr-btn--settings" data-pr="settings-btn">
    <span class="pr-btn-icon" aria-hidden="true">&#9881;</span>
    <span class="pr-btn-label">⚙</span>
  </button>
</div>

<!--
  Assert panel (the third sigil, "A"). Unlike R/F, an assert has no open/close pairing
  and no out-of-band scope/item split to reconstruct - it resolves to one outcome in one
  instant, the same shape "+ Field" (below) already uses for a field pick. That is why
  this reuses the exact same mechanism rather than inventing a new one: pick the check
  TYPE first (the dropdown), fill in whatever value that type needs, then either click
  "Pick target" (arms the picker for anything that checks an element) or "Capture" (for
  a URL check, which has no element to pick - it reads the current page's own URL
  immediately on click, out-of-band, the same instant the marker fires).
  "Pick target" and "Capture" both carry a FIXED marker (`playright:assert:pick`, set
  once below, never mutated) - unlike the field confirm button's per-click dynamic
  label, an assert's check type/value travels entirely through the out-of-band
  `__pwEvent` payload (ir.js's queue-position pairing, same as field), so the marker
  itself never needs to encode anything beyond "a pick happened here".

  Hidden by default; overlay.js toggles it on the A button's click, independent of
  R/F/fState - a page-scoped assert is not tied to being inside an open F body.
-->
<div class="pr-assert" data-pr="assert" hidden>
  <select class="pr-assert-select" data-pr="assert-type">
    <option value="exists">Element exists</option>
    <option value="not-exists">Element not found</option>
    <option value="multiple">Multiple elements found</option>
    <option value="text-equals">Text equals…</option>
    <option value="text-contains">Text contains…</option>
    <option value="attribute">Attribute equals…</option>
    <option value="url-contains">URL contains…</option>
    <option value="url-equals">URL equals…</option>
  </select>
  <input type="text" class="pr-assert-attr" data-pr="assert-attr" placeholder="Attribute name" hidden autocomplete="off" />
  <input type="text" class="pr-assert-value" data-pr="assert-value" placeholder="Expected value" hidden autocomplete="off" />
  <button type="button" class="pr-pill" data-pr="assert-pick-btn" aria-label="playright:assert:pick" disabled>Pick target</button>
  <button type="button" class="pr-pill" data-pr="assert-capture-btn" aria-label="playright:assert:pick" hidden>Capture</button>
</div>

<!--
  Field-pick entry point (Phase 3.2). No preset field names live here on purpose - this
  overlay is used on every kind of listing (jobs, products, search results, anything),
  and a fixed set of pills ("Title", "Location", ...) would just be wrong guesses for
  most of them. The only affordance is "+ Field": the user always types the field name
  that makes sense for THEIR page. One-shot arm -> pick -> capture, not a toggle:
  pressing it, then typing a label and confirming, arms picking for that field; the very
  next picker click captures it and the toolbar falls back to idle, ready for the next
  field. `hidden` by default - overlay.js only reveals this row while an F body is
  actually open (fState === 'body'), since a field selector has nothing to be relative to
  otherwise; JS toggles the attribute rather than a class so an idle toolbar has nothing
  extra painted.

  aria-label is set at mount time in overlay.js to a no-op `playright:field:add` marker -
  it must carry the `playright:` prefix so ir.js's overlay-noise filter drops the click
  on it, the same way it drops stepper/settings chrome; without that prefix this button's
  own click would leak into the recorded flow as a stray step.
-->
<div class="pr-fields" data-pr="fields" hidden>
  <button type="button" class="pr-pill pr-pill--add" data-pr="field-add-btn">+ Field</button>
</div>

<!--
  Custom field label entry, shown only after "+ Field" is pressed. A plain text input
  rather than window.prompt(): a native dialog can't be scripted through the picker's own
  click machinery the same way, and typing here (via the 'input' listener in overlay.js)
  lets the confirm button's aria-label be set BEFORE it is ever clicked - i.e. before
  Playwright's recorder reads its accessible name - rather than mutated inside the click
  handler that fires the very action being recorded.
-->
<div class="pr-field-custom" data-pr="field-custom" hidden>
  <input type="text" class="pr-field-input" data-pr="field-input" placeholder="Field name" autocomplete="off" />
  <button type="button" class="pr-pill" data-pr="field-confirm-btn" disabled>Add</button>
</div>
